name: field-capture

services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Same folder as before Postgres 18, so 18 refuses a volume from an older version instead of starting empty.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for recordings (milestone 2). Not published to the host.
  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    command: ["/data"]
    volumes:
      - rustfs-data:/data

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "3100"
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      TRUST_PROXY: ${TRUST_PROXY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-recordings}
      ENABLE_DEV_TOOLS: "false"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
    # no published ports: only the proxy below can reach it
  # --- pick ONE edge proxy with a profile ---
  # tailnet: HTTPS with the cert files from `tailscale cert`, reachable on your tailnet
  caddy-tailnet:
    image: caddy:2
    profiles: ["tailnet"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      TAILNET_HOST: ${TAILNET_HOST}
    ports:
      - "${TAILNET_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile.tailnet:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data-tailnet:/data

  # public VPS: Caddy gets and renews a Let's Encrypt cert for $DOMAIN
  caddy-public:
    image: caddy:2
    profiles: ["public"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy-data-public:/data

volumes:
  pgdata:
  rustfs-data:
  caddy-data-tailnet:
  caddy-data-public:
