name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and formatting
        run: npm run check
      - name: Types
        run: npm run typecheck
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit

  test:
    name: Full tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Settings
        run: cp .env.example .env
      - name: Start Postgres and RustFS
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait db rustfs
      - name: Install ffmpeg (the video test is skipped without it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Tests and endpoint check
        run: npm test
      - name: Service logs
        if: failure()
        run: docker compose logs --tail=100 db rustfs

  images:
    name: Docker images (${{ matrix.image }})
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: field-capture-app
            context: .
          - image: field-capture-db
            context: db
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short commit id
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build, and push on main
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
          tags: |
            ghcr.io/ai-ldcs/${{ matrix.image }}:latest
            ghcr.io/ai-ldcs/${{ matrix.image }}:sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=CC-BY-NC-4.0
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  published:
    name: Published images start
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Settings, pinned to this commit
        run: |
          cp .env.example .env
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> .env
      - name: Both CPU types are published
        run: |
          for image in field-capture-app field-capture-db; do
            docker buildx imagetools inspect "ghcr.io/ai-ldcs/$image:sha-${GITHUB_SHA::7}" | tee /dev/stderr | grep -q linux/amd64
            docker buildx imagetools inspect "ghcr.io/ai-ldcs/$image:sha-${GITHUB_SHA::7}" | grep -q linux/arm64
          done
      - name: Pull and start, as a server does
        run: |
          docker compose pull db app
          docker compose up -d --no-build --wait db rustfs
          docker compose up -d --no-build app
      - name: The app answers
        run: |
          for _ in $(seq 30); do
            if docker compose exec -T app node -e "fetch('http://localhost:3100/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              docker compose logs app | grep "migration applied"
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100 app
          exit 1
